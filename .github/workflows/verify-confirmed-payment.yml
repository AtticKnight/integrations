name: Check confirmed payments
on:
  push:
    branches: [verify/confirmed-payments]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:package
        env:
          ATTO_TEST_PACKAGE_INTEGRATION: '1'
