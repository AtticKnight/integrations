name: Verify native ATTO recipient approvals
on:
  push:
    branches: [verify/native-recipient-allowlist]
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run the complete wallet and Marketplace test suites
        run: npm test
      - name: Exercise the CLI and MCP against a disposable LOCAL Atto node
        run: npm run test:integration
