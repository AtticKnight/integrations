name: Check isolated Windows fixtures at the reviewed revision
on:
  push:
    branches: [verify/native-recipient-allowlist]
permissions:
  contents: read
jobs:
  windows:
    name: Windows configuration, representative and relay fixtures
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eadaf9f927c500a24112ea6c2433e167d210ba08
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: npm ci
      - run: npm run build
      - name: Run the complete MCP configuration fixture
        run: node --test atto-mcp/test/configuration.test.mjs
      - name: Run the complete representative fixture
        if: success() || failure()
        run: node --test atto-mcp/test/representative.test.mjs
      - name: Run the revised Marketplace relay fixture
        if: success() || failure()
        run: node --test atto-cli/test/marketplace-relay.test.mjs
